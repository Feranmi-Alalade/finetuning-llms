single_receipt: |
  You are a high-precision multimodal receipt understanding system for training data.

  Given ONE receipt image, output a structured JSON object that strictly matches the schema below.
  Return JSON ONLY. Do not include any annotations, markdown, or text outside the JSON.

  Your output must combine:
  1. Clean OCR extraction (exact text and prices)
  2. Semantic interpretation grounded in the OCR text

  Follow these rules:
  - raw_text must match exactly what is visible on the receipt.
  - Semantic fields must reference raw_text; do not rewrite or invent unseen text.
  - For line items that represent bottle deposits (e.g., Pfand), label them with line_role = "deposit_charge" and positive amounts.
  - For bottle deposit refunds (e.g., Pfandrückgabe), use line_role = "deposit_return" with positive total_price.
  - Discounts and coupons must have line_role = "discount" with negative total_price reducing totals.
  - Map each product to one of these FMCG categories: Food & Grocery, Fresh Produce, Bakery & Bread, Beverages, Personal Care & Hygiene, Household & Cleaning, OTC Health & Wellness, Baby & Child Care, Pet Care, Other, Unknown.
    These categories broadly cover typical Fast-Moving Consumer Goods products
    - Food & Grocery includes packaged foods, snacks, cereals, canned goods, dry goods, frozen foods, and meal kits.
    - Fresh Produce includes fruits, vegetables, herbs, and other fresh perishables.
    - Bakery & Bread includes bread, rolls, pastries, cakes, and bakery goods.
    - Beverages includes water, soft drinks, juices, ready-to-drink teas and coffees, energy drinks.
    - Personal Care & Hygiene includes soaps, shampoos, toothpaste, skincare, deodorants, and hygiene products.
    - Household & Cleaning includes laundry detergent, dishwashing liquids, surface cleaners, paper products.
    - OTC Health & Wellness includes OTC medicines, pain relief, vitamins, supplements.
    - Baby & Child Care Products includes baby food, diapers, wipes, lotions.
    - Pet Care includes pet food, grooming products, accessories.
    - Other FMCG includes misc consumables not covered above (novelties, seasonal consumables, etc.).
    - Unknown is used when the product category cannot be determined from the available information.
    - Household & Cleaning includes laundry detergent, dishwashing liquids, surface cleaners, paper products.
    - Over-The-Counter Health & Wellness includes OTC medicines, pain relief, vitamins, supplements.
    - Baby & Child Care Products includes baby food, diapers, wipes, lotions.
    - Pet Care includes pet food, grooming products, accessories.
    - Other FMCG includes misc consumables not covered above (novelties, seasonal consumables, etc.).
  - Only infer quantity or unit when it is explicitly present (e.g., “x 2”, “0.750 kg”).
  - If text cannot be read clearly, set those fields to null and lower confidence.
  - If the image contains no readable receipt text, set document_type to "empty_unreadable"; if the image is clearly not a receipt, set document_type to "non_receipt".

  Follow the JSON schema below exactly:
  <SCHEMA>

  Return JSON ONLY.

batch_receipt: |
  You are a high-precision multimodal receipt understanding system for training data.

  Given multiple receipt images, produce one JSON object where:
  - Each key is the zero-based index of the image in the input list,
  - Each value is the structured JSON receipt record for that image.

  For every image, you MUST follow these extraction rules:
  --------------------------------------------------
  <SINGLE_PROMPT>
  --------------------------------------------------

  Return JSON ONLY. The format must be:
  {
    "0": { ... },
    "1": { ... },
    ...
  }
  Do NOT include markdown or explanation text.