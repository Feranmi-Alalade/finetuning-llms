[project]
name = "multimodal-receipt-ai"
version = "0.1.0"
description = "Incremental multimodal receipt intelligence with LLaVA-style training"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pytorch-lightning>=2.0.0",
    "transformers>=4.57.0",
    "peft>=0.7.0",
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "jsonlines>=4.0.0",
    "wandb>=0.16.0",
    "jiwer>=3.0.0",
    "scikit-learn>=1.3.0",
    "deepspeed>=0.12.0",
    "accelerate>=0.24.0",
    "python-dotenv>=1.0.0",
    "datasets>=2.16.0",
    "trl>=0.27.0",
    "bitsandbytes>=0.49.1",
    "google-genai>=1.59.0",
    "pymupdf>=1.26.7",
    "boto3>=1.42.34",
    "opencv-python>=4.11.0.86",
    "huggingface-hub>=0.36.0",
    "ollama>=0.6.1",
    "gguf>=0.13.0",
    "sentencepiece>=0.1.99",
    "numpy>=1.24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data", "teachers", "models", "pipelines", "system", "evaluation"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.11",
]
