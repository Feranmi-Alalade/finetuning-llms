# Task-Specific Configuration: Qwen3-VL 8B Fine-Tuning
default:
  paths:
    data_dir: "."
    sources_dir: "."
    artifacts_dir: "artifacts"
    manifests_dir: "data/manifests"
    logs_dir: "logs"
    cache_dir: "cache"

  models:
    fine_tune_base:
      name: "Qwen/Qwen3-VL-8B-Instruct"  # Fallback/default logic
      dtype: "bfloat16"
      device: "auto"
      attn_implementation: "sdpa"
      trust_remote_code: true
      load_in_8bit: false
      load_in_4bit: true # Use 4bit for training memory efficiency

  data:
    dtype: "float32"
    ignore_index: -100

  data_prep:
    max_pixels: 1048576
    max_side: 1024
    num_workers: 0  # Default to 0 for Mac compatibility, override in prod

  training:
    mode: "lora"  # "lora" or "qlora"
    experiment_name: null  # auto-generated if null: m0_ocr_{mode}_{timestamp}_{env}
    batch_size: 1
    eval_batch_size: 1
    gradient_accumulation_steps: 4
    learning_rate: 2.0e-4
    lr_scheduler_type: "cosine"
    warmup_ratio: 0.03
    weight_decay: 0.01
    max_steps: -1
    num_train_epochs: 3
    save_steps: 100
    logging_steps: 10
    eval_steps: 100
    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    lora_target_modules:
      - "q_proj"
      - "k_proj"
      - "v_proj"
      - "o_proj"
      - "gate_proj"
      - "up_proj"
      - "down_proj"
    output_dir: "artifacts/outputs/m0_ocr/training"
    max_seq_length: 2048
    gradient_checkpointing: true

  export:
    huggingface:
      enabled: true
      repo_id: "bildcraft/qwen3-vl-8b-m0-ocr-adapter" # Standard LoRA adapter naming
      private: true
      
    gguf:
      enabled: true
      quantization: "Q4_K_M" # Recommended balance
      
    ollama:
      enabled: true
      model_name: "bildcraft/receipt-ai-m0" # Following docs/deployment.md
      tag: "8b-q4"

  logging:
    level: "INFO"
    wandb_project: "multimodal-receipt-ai-m0-ocr"

dev:
  logging:
    level: "DEBUG"
  models:
    fine_tune_base:
      name: "Qwen/Qwen3-VL-2B-Instruct"
      dtype: "bfloat16"  # Native MPS support
  data_prep:
    max_pixels: 65536  # ~256x256 (Memory safe for Mac)
  training:
    max_seq_length: 6144  # Balanced: enough for vision+text, less memory than 8k
    num_train_epochs: 1
    max_steps: 5  # Quick sanity check
    batch_size: 1
    eval_batch_size: 1
    gradient_accumulation_steps: 8  # Effective batch size = 8
    logging_steps: 1
    eval_steps: 50  # Eval less frequently to save memory
    save_steps: 50
    output_dir: "artifacts/outputs/m0_ocr/training/dev"
  export:
    huggingface:
      enabled: true
      repo_id: "bildcraft/qwen3-vl-2b-m0-ocr-dev"
      private: true
    gguf:
      enabled: false
    ollama:
      enabled: false

prod:
  models: 
    fine_tune_base:
      name: "Qwen/Qwen3-VL-8B-Instruct"
  training:
    num_train_epochs: 3
    max_steps: -1  # Use epochs
    batch_size: 2  # Per device on 4 GPUs
    eval_batch_size: 2
    gradient_accumulation_steps: 4
    output_dir: "artifacts/outputs/m0_ocr/training/prod"
  export:
    huggingface:
      enabled: true
      repo_id: "bildcraft/qwen3-vl-8b-m0-ocr-adapter"
    gguf:
      enabled: true
    ollama:
      enabled: true
      model_name: "bildcraft/receipt-ai-m0"
      tag: "8b-q4"
  logging:
    level: "INFO"
